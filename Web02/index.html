<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Web02</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #111;
      color: #00ffcc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      text-align: center;
      border: 2px solid #00ffcc;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 20px #00ffcc;
    }
    h1 {
      font-size: 3rem;
    }
    p {
      color: #ccc;
    }
    .badge {
      margin-top: 15px;
      color: #111;
      background: #00ffcc;
      padding: 8px 15px;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💻 Web 02</h1>
    <p>Segundo servicio con Docker</p>
    <div class="badge">Puerto 4001</div>
  </div>
</body>
</html>
